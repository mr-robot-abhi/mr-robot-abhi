
name: Update Top Contributed Repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution card
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        shell: python
        run: |
          import os
          import json
          import html
          import urllib.request
          from datetime import datetime, timezone

          username = "Manthanhk"
          token = os.environ["PROFILE_TOKEN"]

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                commitContributionsByRepository(maxRepositories: 100) {
                  repository { nameWithOwner }
                  contributions { totalCount }
                }
                pullRequestContributionsByRepository(maxRepositories: 100) {
                  repository { nameWithOwner }
                  contributions { totalCount }
                }
                issueContributionsByRepository(maxRepositories: 100) {
                  repository { nameWithOwner }
                  contributions { totalCount }
                }
              }
            }
          }
          """

          payload = {
              "query": query,
              "variables": {
                  "login": username,
                  "from": "2008-01-01T00:00:00Z",
                  "to": datetime.now(timezone.utc).isoformat()
              }
          }

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)

          if result.get("errors"):
              raise SystemExit(str(result["errors"]))

          user = result.get("data", {}).get("user")
          if not user:
              raise SystemExit("GitHub user not found.")

          totals = {}
          collection = user["contributionsCollection"]

          for field in [
              "commitContributionsByRepository",
              "pullRequestContributionsByRepository",
              "issueContributionsByRepository"
          ]:
              for item in collection[field]:
                  name = item["repository"]["nameWithOwner"]
                  count = item["contributions"]["totalCount"]
                  totals[name] = totals.get(name, 0) + count

          repos = sorted(
              totals.items(),
              key=lambda item: item[1],
              reverse=True
          )[:5]

          width = 760
          height = 120 + max(1, len(repos)) * 52

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}">',
              '<rect width="100%" height="100%" rx="18" fill="#0d1117" stroke="#30363d"/>',
              '<text x="28" y="42" fill="#7ee787" font-size="23" font-weight="bold" font-family="Arial,sans-serif">Top Contributed Repositories</text>',
              f'<text x="28" y="68" fill="#8b949e" font-size="13" font-family="Arial,sans-serif">{html.escape(username)}</text>'
          ]

          if not repos:
              svg.append('<text x="28" y="112" fill="#c9d1d9" font-size="14">No contribution data found.</text>')

          for rank, (name, count) in enumerate(repos, 1):
              y = 88 + rank * 52
              svg.extend([
                  f'<rect x="20" y="{y-26}" width="720" height="42" rx="9" fill="#161b22"/>',
                  f'<text x="36" y="{y}" fill="#7ee787" font-size="14">#{rank}</text>',
                  f'<text x="78" y="{y}" fill="#e6edf3" font-size="14">{html.escape(name)}</text>',
                  f'<text x="718" y="{y}" fill="#7ee787" text-anchor="end" font-size="14">{count}</text>'
              ])

          svg.append("</svg>")

          os.makedirs("assets", exist_ok=True)
          with open("assets/top-contri.svg", "w", encoding="utf-8") as file:
              file.write("\n".join(svg))

          print("Generated assets/top-contri.svg")

      - name: Commit generated image
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update top contributed repos card"
          file_pattern: assets/top-contri.svg
